name: 보육비서 코드와 인증·기록 흐름 검증

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 정적 검사와 회귀 검증
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 실제 Worker 실행기 의존성 준비
        run: npm install --no-audit --no-fund

      - name: JavaScript 구문·파일 크기·인증·기록 검증
        run: |
          echo "JavaScript 실제 파서 검사"
          node --check worker.js
          node --check public/app.js
          node --check public/gemini-client.js
          node --check public/js/auth-security.js
          node --check public/js/notion-store.js
          node --check public/js/ai-engine.js
          node --check public/js/records-flow.js
          node --check public/js/memo-sync.js
          node --check api/auth.js
          node --check api/notion.js
          node --check api/memo.js
          node --check api/gemini.js
          node --check api/notion-proxy-guard.js
          node --test tests/*.test.js
          python scripts/verify_js_modules.py
          echo "정적 검사와 회귀 검증 완료. 운영 배포와 화면 확인은 별도 수행합니다."
